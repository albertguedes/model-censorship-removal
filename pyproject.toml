[project]
name = "model-censorship-removal"
version = "1.4.0"
description = "Automatic neutralization of safety alignment constraints in transformer-based language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Albert Mendes", email = "albertguedes@users.noreply.github.com" },
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" },
]
requires-python = ">=3.10"
keywords = ["llm", "transformer", "safety", "alignment", "abliteration", "content-moderation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "accelerate~=1.13",
    "bitsandbytes~=0.49",
    "datasets~=4.7",
    "huggingface-hub~=1.7",
    "immutabledict~=4.3",
    "langdetect~=1.0",
    "lm-eval[hf]~=0.4",
    "numpy~=2.2",
    "optuna~=4.7",
    "peft~=0.19",
    "psutil~=7.2",
    "py-cpuinfo~=9.0",
    "pydantic-settings~=2.13",
    "questionary~=2.1",
    "rich~=14.3",
    "tomli-w~=1.2",
    "torch",  # version deliberately unspecified
    "torchvision",  # version deliberately unspecified
    "tqdm~=4.67",
    "transformers[kernels]~=5.6",
]

[project.optional-dependencies]
research = [
    "geom-median~=0.1",
    "imageio~=2.37",
    "matplotlib~=3.10",
    "pacmap~=0.8",
    "scikit-learn~=1.7",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.5",
]

[project.urls]
Homepage = "https://github.com/albertguedes/model-censorship-removal"
Documentation = "https://github.com/albertguedes/model-censorship-removal"
Repository = "https://github.com/albertguedes/model-censorship-removal.git"
Issues = "https://github.com/albertguedes/model-censorship-removal/issues"
Changelog = "https://github.com/albertguedes/model-censorship-removal/releases"

[project.scripts]
mcr = "mcr.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "mcr"
